# Rustico - prospetti e sezioni. Fonte: GRAFICO.dwg (pianta) + altezze dell'utente + foto del sopralluogo.
# Coordinate: origine nello spigolo interno sud-ovest del Vano 1. Il DWG ha tutti i muri "verticali"
# inclinati di 2,2 gradi: imprecisione del disegno, raddrizzata. Il muro est del Vano 3 devia di altri
# 5 gradi: e' storto davvero e resta storto.
pratica: {codice: R001, tipo: rilievo, titolo: "Fabbricato rurale - prospetti e sezioni"}
nord_gradi: 90
nord_ipotizzato: true
quota_terreno: {valore: -0.10, fonte: ipotesi, nota: "gradino d'ingresso stimato dalle foto"}
materiale: pietra lavica
spessori: {esterni: 0.45, interni: 0.35}
locali:
  - {nome: Vano 1, larghezza: 6.35, profondita: 3.71, h_min: 2.10, h_max: 3.80,
     spessori_lati: {ovest: 0.35, sud: 0.49, nord: 0.60}}
  - {nome: Vano 2, a_destra_di: Vano 1, spessore_muro: 0.35, larghezza: 3.85, profondita: 3.81,
     h_min: 3.00, h_max: 3.80, spessori_lati: {est: 0.45, sud: 0.49, nord: 0.50}}
  - {nome: Vano 3, origine: [6.18, 4.31], larghezza: 4.68, larghezza_nord: 4.39, profondita: 3.16,
     spessore_esterno: 0.15, materiale: blocchi di cls, h_min: 2.05, h_max: 3.00}
aperture:
  # Vano 1, sud (foto 11, 3): finestra alta con ante in ferro; porta in ferro con parte vetrata
  - {locale: Vano 1, lato: sud, dal: ovest, da: 0.49, a: 1.99, tipo: finestra,
     altezza: {valore: 1.50, fonte: ipotesi, nota: "foto 11: finestra alta quasi quanto la porta"},
     davanzale: {valore: 0.70, fonte: ipotesi, nota: "foto 11"}, infisso: ante in ferro}
  - {locale: Vano 1, lato: sud, dal: ovest, da: 3.64, a: 5.64, tipo: porta, altezza: 2.20, infisso: ferro e vetro}
  # Vano 1, nord (foto 1, 2, 19): finestra bassa e larga con grata a losanghe, spallette in mattoni
  - {locale: Vano 1, lato: nord, dal: ovest, da: 0.51, a: 2.01, tipo: finestra,
     altezza: {valore: 0.80, fonte: ipotesi, nota: "foto 2 e 19: finestra bassa e larga con grata"},
     davanzale: {valore: 1.10, fonte: ipotesi, nota: "foto 19"}, infisso: grata}
  # Vano 2, sud (foto 7, 12, 13): portone in legno a due ante, architrave ad arco ribassato, soglia in pietra
  - {locale: Vano 2, lato: sud, dal: ovest, da: 1.51, a: 2.66, tipo: porta, forma: arco_ribassato,
     altezza: {valore: 2.20, fonte: ipotesi, nota: "foto 12-13: rapporto con la larghezza 1,15"},
     battente: doppio, infisso: legno}
  # Vano 2 -> Vano 3 (foto 5, 6): porta ad arco, H 1,80
  - {locale: Vano 2, lato: nord, dal: ovest, da: 2.06, a: 2.96, tipo: porta, forma: arco, altezza: 1.80}
  # Vano 3, ovest (foto 17): porta con spallette in mattoni
  - {locale: Vano 3, lato: ovest, dal: sud, da: 0.10, a: 0.95, tipo: porta,
     altezza: {valore: 2.00, fonte: ipotesi, nota: "foto 17"}}
  # Vano 3, nord (foto 10): finestrella
  - {locale: Vano 3, lato: nord, dal: ovest, da: 2.39, a: 2.79, tipo: finestra,
     altezza: {valore: 0.40, fonte: ipotesi, nota: "foto 10"},
     davanzale: {valore: 1.40, fonte: ipotesi, nota: "foto 10"}}
coperture:   # altezze all'intradosso dell'utente; forma dalle foto; spessore e sporto stimati
  # Vano 1 a una falda verso ovest (foto 11, 19, 1, 2: muri sud e nord con sommita' che sale verso est),
  # appoggiata al timpano ovest del Vano 2 (foto 12-13)
  - {locali: [Vano 1], tipo: una_falda, bassa: ovest, h_alta: 3.80, h_bassa: 2.10, spessore: 0.30, sporto: 0.15,
     si_appoggia_a: [Vano 2], ipotesi: "spessore del tetto (0,30) e sporto (0,15) stimati dalle foto"}
  # Vano 2 a capanna con colmo est-ovest (foto 12-13: gronda a sud; foto 14-15: timpano est in pietra con
  # pinnacolo, a filo muro: niente sporto sui timpani)
  - {locali: [Vano 2], tipo: capanna, colmo: x, h_imposta: 3.00, h_colmo: 3.80, spessore: 0.30, sporto: 0.15,
     sporto_timpani: 0.0, ipotesi: "spessore del tetto (0,30) e sporto di gronda (0,15) stimati dalle foto"}
  # Vano 3 a una falda verso nord appoggiata al muro nord del Vano 2: nelle foto 15-16 la sommita' del muro
  # in blocchi prosegue la falda del Vano 2 senza gradino e senza sporto laterale -> manto sottile (0,10)
  - {locali: [Vano 3], tipo: una_falda, bassa: nord, h_alta: 3.00, h_bassa: 2.05, spessore: 0.10, sporto: 0.10,
     sporto_timpani: 0.0, si_appoggia_a: [Vano 2],
     ipotesi: "spessore del tetto (0,10) e sporto di gronda (0,10) stimati dalle foto"}
sezioni:   # A: lungo la falda del Vano 1 e attraverso la capanna del Vano 2; B: Vano 2 -> Vano 3 dalla porta H 1,80
  - {nome: A, p0: [-1.5, 1.9], p1: [12.0, 1.9], verso: sx}
  - {nome: B, p0: [9.2, -1.5], p1: [9.2, 9.0], verso: sx}
