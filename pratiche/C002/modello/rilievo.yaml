# Appartamento al 4° piano - pianta per APE. Fonte: planimetria catastale del 1969, scala 1:200, scansione
# (1 pixel = 2,54 cm, scala dalla barra "10 metri" del PDF), raddrizzata di 1,6 gradi. Misure a +/- 3 cm.
# Regole dell'utente: disegno dritto, muri esterni 30 cm centrati sugli assi del catastale, tramezzi 10 cm.
# Origine: assi del muro ovest e del muro sud del foglio (in basso a sinistra); x verso destra, y verso l'alto.
# Soggiorno, disimpegno e ingresso sono un unico spazio (nel catastale non ci sono tramezzi fra loro):
# tre rettangoli a contatto, senza muro in mezzo.
pratica: {codice: C002, tipo: rilievo, titolo: "Appartamento al 4° piano - pianta per APE"}
nord_gradi: 240   # simbolo ORIENTAMENTO del catastale: nord verso il basso a sinistra del foglio
nord_ipotizzato: false
spessori: {esterni: 0.30, interni: 0.10}
locali:
  - {nome: Vano ovest, origine: [0.15, 4.36], larghezza: 4.03, profondita: 4.67, h: 3.00}
  - {nome: Disimpegno, origine: [4.18, 4.36], larghezza: 9.42, profondita: 0.87, h: 3.00}
  - {nome: Ingresso, origine: [13.60, 4.36], larghezza: 1.90, profondita: 1.84, h: 3.00}
  - {nome: Cucina, origine: [4.28, 5.33], larghezza: 2.64, profondita: 3.70, h: 3.00}
  - {nome: Lavanderia, origine: [7.02, 5.33], larghezza: 1.05, profondita: 3.70, h: 3.00}
  - {nome: WC, origine: [8.17, 5.33], larghezza: 1.84, profondita: 3.70, h: 3.00}
  - {nome: Vano nord-est, origine: [10.11, 5.33], larghezza: 3.39, profondita: 4.77, h: 3.00}
  - {nome: Camera sud-ovest, origine: [0.15, 0.15], larghezza: 4.98, profondita: 4.11, h: 3.00}
  - {nome: Camera sud-est, origine: [5.23, 0.15], larghezza: 4.27, profondita: 4.11, h: 3.00}
aperture:
  # finestre: dai trattini del catastale; altezza e davanzale non riportati
  - {locale: Vano ovest, lato: nord, dal: ovest, da: 1.16, a: 2.86, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: Cucina, lato: nord, dal: ovest, da: 1.07, a: 2.24, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: Lavanderia, lato: nord, dal: ovest, da: 0.07, a: 0.93, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: WC, lato: nord, dal: ovest, da: 0.21, a: 1.08, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: Vano nord-est, lato: nord, dal: ovest, da: 1.00, a: 2.39, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: Camera sud-ovest, lato: sud, dal: ovest, da: 2.00, a: 3.56, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  - {locale: Camera sud-est, lato: sud, dal: ovest, da: 1.02, a: 2.48, tipo: finestra,
     altezza: {valore: 1.40, fonte: ipotesi, nota: "non riportata nel catastale"},
     davanzale: {valore: 1.00, fonte: ipotesi, nota: "non riportato nel catastale"}}
  # ingresso dal pianerottolo (freccia del catastale), 1,12 m
  - {locale: Ingresso, lato: nord, dal: ovest, da: 0.46, a: 1.58, tipo: porta, battente: sx,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  # passaggi interni: varchi nelle linee dei tramezzi (per l'APE non serve l'anta)
  - {locale: Cucina, lato: sud, dal: ovest, da: 1.26, a: 2.35, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  - {locale: Lavanderia, lato: sud, dal: ovest, da: 0.12, a: 1.01, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  - {locale: WC, lato: sud, dal: ovest, da: 0.49, a: 1.51, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  - {locale: Vano nord-est, lato: sud, dal: ovest, da: 2.13, a: 3.38, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  - {locale: Camera sud-ovest, lato: nord, dal: ovest, da: 4.02, a: 4.96, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
  - {locale: Camera sud-est, lato: nord, dal: ovest, da: 3.05, a: 3.81, tipo: varco,
     altezza: {valore: 2.10, fonte: ipotesi, nota: "non riportata nel catastale"}}
